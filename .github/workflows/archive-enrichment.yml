name: Historical SAM Archive Enrichment
on:
  pull_request:
    paths:
      - '.github/workflows/archive-enrichment.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - run: python scripts/enrich_sam_archive.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/green_gregory/archive_enrichment data/green_gregory/sam_archive_enriched_100.csv data/green_gregory/sam_archive_enriched_part*.json data/green_gregory/sam_archive_enrichment_summary.json
          git commit -m 'Add GGG historical archive enrichment results' || exit 0
          git push origin HEAD:ggg-archive-enrichment-run
