name: SAM Historical Open Solicitation Intake

on:
  push:
    paths:
      - '.github/workflows/sam-historical-intake.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract official historical solicitation and award indexes
        run: python scripts/extract_sam_historical.py
      - name: Preserve failed outcome-conditioned sampling pass
        run: python scripts/build_sam_intake_100.py
      - name: Build corrected lane-balanced 100-record intake
        run: python scripts/build_balanced_sam_intake_100.py
      - name: Build Drive paste-data parts
        run: python scripts/build_drive_paste_parts.py
      - name: Install workbook dependency
        run: python -m pip install openpyxl
      - name: Generate formatted intake workbook
        run: python scripts/build_intake_workbook.py
      - name: Remove raw extract before commit
        run: rm -f data/green_gregory/ContractOpportunitiesFullCSV.csv
      - name: Commit historical intake outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/green_gregory
          git commit -m 'Generate Drive paste parts for GGG historical intake' || exit 0
          git push
