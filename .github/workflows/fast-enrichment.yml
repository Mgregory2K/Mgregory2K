name: Fast Historical Archive Enrichment
on:
  pull_request:
    paths:
      - '.github/workflows/fast-enrichment.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - run: python scripts/enrich_sam_archive_fast.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/green_gregory/archive_enrichment_fast data/green_gregory/sam_archive_enriched_survivors.csv data/green_gregory/sam_archive_enriched_survivors_summary.json
          git commit -m 'Add fast survivor archive enrichment results' || exit 0
          git push origin HEAD:ggg-fast-enrichment-run
