name: Split Intake Workbook for Transfer
on:
  push:
    paths:
      - '.github/workflows/split-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/split_intake_xlsx_base64.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/green_gregory/xlsx_base64_parts
          git commit -m 'Split intake workbook for Drive transfer' || exit 0
          git push
